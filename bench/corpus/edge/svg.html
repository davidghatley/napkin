<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge: inline SVG</title>
<style>body { margin: 0; padding: 16px; background: #fbfaf7; } .fig text { font: 600 12px/1 ui-monospace, monospace; fill: #16181d; }</style>
</head>
<body>
<svg class="fig" viewBox="0 0 240 120" width="240" height="120" role="img" aria-label="Three shapes">
  <defs><circle id="dot" r="6" fill="#ee5228"/></defs>
  <g id="shapes" stroke="#16181d" stroke-width="2" fill="none">
    <rect x="12" y="20" width="60" height="40"/>
    <circle cx="120" cy="40" r="18" />
    <path d="M168 60 L198 20 L228 60 Z"/>
  </g>
  <use href="#dot" x="42" y="90"/><use href="#dot" x="120" y="90"/>
  <text x="12" y="112">rect · circle · path</text>
</svg>
</body>
</html>
