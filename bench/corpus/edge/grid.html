<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge: grid layout</title>
<style>
body { margin: 0; padding: 16px; font: 14px/20px system-ui, sans-serif; background: #f6f7f9; }
.layout {
  display: grid;
  grid-template-columns: [full-start] 160px [main-start] minmax(0, 1fr) [full-end];
  grid-template-areas:
    "side head"
    "side main";
  gap: 12px;
}
.side { grid-area: side; background: #dde1f2; padding: 12px; }
.head { grid-area: head; background: #fde68a; padding: 12px; }
.main { grid-area: main; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.tile { background: #ffffff; border: 1px solid #c9ccd2; padding: 10px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">Side</aside>
  <header class="head">Header</header>
  <main class="main">
    <div class="tile">One</div>
    <div class="tile">Two</div>
    <div id="g-a">Three, no class yet</div>
    <div class="tile">Four</div>
  </main>
</div>
</body>
</html>
