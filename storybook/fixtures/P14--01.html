<div id="theme-wipe" role="group" aria-label="Theme wipe" data-nodrag="1"><label class="tw-side">Left of the line <select id="tw-left" aria-label="Theme left of the line"><option value="light" selected="">Light</option><option value="dark">Dark</option></select></label>
    <input id="tw-range" type="range" min="0" max="100" step="1" value="50" aria-label="Wipe position: how much of the canvas shows the left theme">
    <label class="tw-side">Right <select id="tw-right" aria-label="Theme right of the line"><option value="light">Light</option><option value="dark" selected="">Dark</option></select></label>
    <button type="button" id="tw-close" aria-label="Close the theme wipe (Escape)">Done <kbd>Esc</kbd></button></div>
