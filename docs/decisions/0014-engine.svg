<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12">
  <title>Plate 0014: the document engine</title>
  <desc>A folder of files is read as bytes and mapped (HTML, CSS, JSX source maps). Edits become byte splices through one path and are written back in place. Each component is served as its own document at /view and drawn in an iframe on the canvas. The only state napkin keeps is outside the folder.</desc>
  <rect x="0" y="0" width="960" height="470" fill="#f4f1ea"/>
  <g fill="none" stroke="#1d1f24" stroke-width="1.5">
    <rect x="24" y="56" width="200" height="300"/>
    <rect x="300" y="56" width="230" height="140"/>
    <rect x="300" y="236" width="230" height="120"/>
    <rect x="610" y="56" width="326" height="140"/>
    <rect x="610" y="236" width="326" height="120"/>
    <rect x="24" y="396" width="912" height="50" stroke-dasharray="5 4"/>
  </g>
  <g fill="#1d1f24">
    <text x="24" y="34" font-weight="700" font-size="14">PLATE 0014 · THE DOCUMENT ENGINE (src/doc/)</text>
    <text x="36" y="80" font-weight="700">THE FOLDER, AS IT IS</text>
    <text x="36" y="104">Pill/preview.html</text>
    <text x="36" y="122">components.css</text>
    <text x="36" y="140">tokens.css</text>
    <text x="36" y="158">ui/button.tsx</text>
    <text x="36" y="192" fill="#5f636b">read as bytes (latin1:</text>
    <text x="36" y="208" fill="#5f636b">1 char = 1 byte)</text>
    <text x="36" y="244" fill="#5f636b">written only by an edit:</text>
    <text x="36" y="260" fill="#5f636b">atomic, refused if the</text>
    <text x="36" y="276" fill="#5f636b">file changed meanwhile</text>
    <text x="312" y="80" font-weight="700">SOURCE MAPS (no model)</text>
    <text x="312" y="104">html.js  elements, attributes</text>
    <text x="312" y="122">css.js   rules, values, @media</text>
    <text x="312" y="140">jsx.js   exports, JSX elements</text>
    <text x="312" y="170" fill="#5f636b">every node: byte ranges +</text>
    <text x="312" y="186" fill="#5f636b">path id "0.1.3"</text>
    <text x="312" y="260" font-weight="700">ONE EDIT PATH · edit.js</text>
    <text x="312" y="284">text attr class style prop</text>
    <text x="312" y="302">rule var insert move delete</text>
    <text x="312" y="328" fill="#5f636b">-> byte splices, formatting</text>
    <text x="312" y="344" fill="#5f636b">mirrored; one spot refused</text>
    <text x="622" y="80" font-weight="700">/view/&lt;id&gt; · one document per component</text>
    <text x="622" y="104">HTML: the file's bytes + applied</text>
    <text x="622" y="122">      stylesheets + &lt;base&gt; in &lt;head&gt;</text>
    <text x="622" y="140">TSX:  plain React page (esbuild)</text>
    <text x="622" y="170" fill="#5f636b">canvas: iframe, @media = frame width</text>
    <text x="622" y="186" fill="#5f636b">elements mapped DOM &lt;-&gt; source node</text>
    <text x="622" y="260" font-weight="700">folder.js · revisions, undo, watcher</text>
    <text x="622" y="284">revision = sha256(bytes)[0:12]</text>
    <text x="622" y="302">undo/redo per component and caller</text>
    <text x="622" y="320">stale edits re-based by start tag</text>
    <text x="622" y="344" fill="#5f636b">GET /api/component/&lt;id&gt;/rules: provenance</text>
    <text x="36" y="426" font-weight="700">OUTSIDE THE FOLDER</text>
    <text x="210" y="426">$NAPKIN_STATE_DIR/&lt;sha256(realpath)&gt;/styles.json ("ask once") · layout.json (frames)</text>
  </g>
  <g stroke="#ee5228" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M224 130 H296"/>
    <path d="M415 196 V232"/>
    <path d="M300 300 H228"/>
    <path d="M530 120 H606"/>
    <path d="M530 300 H606"/>
  </g>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ee5228"/></marker></defs>
</svg>
