<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">How agents, napkin and the folder fit together</title>
  <desc id="d">Agents connect over MCP or HTTP to the napkin server. The server keeps runs, the board and the event log in a state directory outside the folder, writes real files into the folder, and streams events to the canvas where the person reviews and answers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3459e2"/></marker>
    <style>
      .box{fill:#fbfbfc;stroke:#1c1f27;stroke-width:1.5}
      .soft{fill:#eef1fb;stroke:#3459e2;stroke-width:1.5}
      .t{font-size:14px;fill:#1c1f27;font-weight:600}
      .s{font-size:12px;fill:#4f5663}
      .l{font-size:11.5px;fill:#2c52d2;font-weight:600}
      .w{stroke:#3459e2;stroke-width:1.6;fill:none}
      .d{stroke:#626a79;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="920" height="460" fill="#ffffff"/>
  <g>
    <rect class="box" x="24" y="40" width="190" height="86" rx="8"/><text class="t" x="40" y="68">Claude Code</text><text class="s" x="40" y="90">claude mcp add napkin ...</text>
    <rect class="box" x="24" y="150" width="190" height="86" rx="8"/><text class="t" x="40" y="178">Codex</text><text class="s" x="40" y="200">codex mcp add napkin ...</text>
    <rect class="box" x="24" y="260" width="190" height="86" rx="8"/><text class="t" x="40" y="288">opencode</text><text class="s" x="40" y="310">one config line</text>
    <rect class="box" x="24" y="370" width="190" height="70" rx="8"/><text class="t" x="40" y="398">A script</text><text class="s" x="40" y="420">MCP stdio or plain HTTP</text>
  </g>
  <text class="l" x="226" y="228">MCP tools</text><text class="l" x="226" y="244">= HTTP routes</text>
  <path class="w" d="M214 83H300" marker-end="url(#a)"/><path class="w" d="M214 193H300" marker-end="url(#a)"/><path class="w" d="M214 303H300" marker-end="url(#a)"/><path class="w" d="M214 405C260 405 270 330 300 320" marker-end="url(#a)"/>
  <rect class="soft" x="300" y="30" width="300" height="410" rx="10"/>
  <text class="t" x="320" y="62">napkin server (one process)</text>
  <g>
    <rect class="box" x="320" y="80" width="260" height="62" rx="6"/><text class="t" x="334" y="105">Runs</text><text class="s" x="334" y="125">plan, steps, artifacts, checkpoints</text>
    <rect class="box" x="320" y="154" width="260" height="62" rx="6"/><text class="t" x="334" y="179">Review</text><text class="s" x="334" y="199">proposals, questions, comments</text>
    <rect class="box" x="320" y="228" width="260" height="62" rx="6"/><text class="t" x="334" y="253">Items and controls</text><text class="s" x="334" y="273">the same path the person uses</text>
    <rect class="box" x="320" y="302" width="260" height="62" rx="6"/><text class="t" x="334" y="327">Board and presence</text><text class="s" x="334" y="347">selection, groups, who is here</text>
    <rect class="box" x="320" y="376" width="260" height="52" rx="6"/><text class="t" x="334" y="399">Event log</text><text class="s" x="334" y="417">one cursor per agent; also the audit trail</text>
  </g>
  <path class="w" d="M600 120H690" marker-end="url(#a)"/><text class="l" x="612" y="112">live events</text>
  <rect class="box" x="690" y="60" width="206" height="130" rx="8"/>
  <text class="t" x="706" y="90">The canvas</text><text class="s" x="706" y="112">Runs panel (Alt+R)</text><text class="s" x="706" y="130">Approve  Reject  Send back</text><text class="s" x="706" y="148">Comment  Answer a question</text><text class="s" x="706" y="170">your selection goes back</text>
  <path class="w" d="M690 170H600" marker-end="url(#a)"/>
  <path class="w" d="M600 260H690" marker-end="url(#a)"/><text class="l" x="607" y="252">real files</text>
  <rect class="box" x="690" y="220" width="206" height="90" rx="8"/><text class="t" x="706" y="250">The opened folder</text><text class="s" x="706" y="272">artifacts, approved files,</text><text class="s" x="706" y="290">control edits. Nothing else.</text>
  <path class="d" d="M600 395H690" marker-end="url(#a)"/><text class="l" x="607" y="387">state</text>
  <rect class="box" x="690" y="350" width="206" height="90" rx="8" stroke-dasharray="5 4"/><text class="t" x="706" y="380">Napkin's state folder</text><text class="s" x="706" y="402">runs, board, event log,</text><text class="s" x="706" y="420">held proposals. Outside the folder.</text>
</svg>
