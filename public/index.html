<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>napkin canvas</title>
<script>try { const t = localStorage.getItem('napkin.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/canvas/canvas.css">
<link rel="stylesheet" href="/canvas/history.css">
<body>
  <a class="skip" href="#stage">Skip to the canvas</a>
  <header id="topbar">
    <div class="brand"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 4.5 12.5 3 17 8l-1.5 9L5 16.5z" fill="var(--accent)" opacity=".18"/><path d="M3 4.5 12.5 3 17 8l-1.5 9L5 16.5z M12.5 3l.6 5 3.9 0" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/></svg><h1>napkin</h1><span id="folder">components</span></div>
    <div id="toolbar"></div>
    <button type="button" id="quick-open" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Jump to…</span><kbd>⌘K</kbd></button>
    <div class="top-right">

      <span class="meta">revision <code id="revision">…</code></span>
      <span class="slot"><span id="agent-status" hidden>agent connected</span><span id="presence" role="status" aria-live="polite"></span></span>
      <button type="button" id="theme-toggle" aria-label="Switch chrome theme" title="Light / dark chrome"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </header>
  <nav id="sidebar" aria-label="Layers and changes">
    <h2 class="pane-title">Layers</h2>
    <div id="layers" role="tree" aria-label="Layers"></div>
    <details id="changes" open><summary>Changes</summary><p id="changes-placeholder" class="empty">No changes yet.</p><ul id="log" aria-live="polite"></ul></details>
  </nav>
  <main id="stage" aria-label="Canvas" tabindex="-1">
    <p id="scan-progress" role="status"></p>
    <div id="world"></div>
    <div id="overlays" aria-hidden="true"></div>
    <div id="marquee" hidden></div>
    <p id="hint" role="status"></p>
    <p id="error" role="status"></p>
  </main>
  <aside id="inspector" aria-label="Design panel">
    <div id="panel"></div>
  </aside>
  <section id="dock" aria-label="Code and proposals" hidden>
    <div id="code-strip"></div>
    <div id="proposals-tray"></div>
  </section>
  <footer id="statusbar">
    <span id="counts" aria-live="off"></span>
    <span id="drawer-tabs" role="group" aria-label="Panels"></span>
    <span class="hints"><kbd>Space</kbd> drag pans <kbd>⌘</kbd> scroll zooms <kbd>⇧1</kbd> fit all <kbd>⇧2</kbd> fit selection <kbd>Enter</kbd> focus</span>
    <span class="zoomctl" role="group" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button type="button" id="zoom-level" aria-label="Zoom level, click for 100%" title="Zoom to 100% (⇧0)">100%</button>
      <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button type="button" id="zoom-fit" aria-label="Fit all" title="Fit all (⇧1)">Fit</button>
    </span>
  </footer>
  <script type="module" src="/canvas/main.js"></script>
</body>
</html>
