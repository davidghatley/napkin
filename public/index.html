<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>napkin canvas</title>
<link rel="icon" type="image/svg+xml" href="/brand/napkin-favicon.svg">
<script type="importmap">{"imports":{"react":"/runtime.js","react-dom":"/runtime.js?module=react-dom","react-dom/client":"/runtime.js?module=react-dom/client","react/jsx-runtime":"/runtime.js?module=react/jsx-runtime"}}</script>
<script>try { const t = localStorage.getItem('napkin.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/canvas/canvas.css">
<link rel="stylesheet" href="/canvas/context-menu.css">
<link rel="stylesheet" href="/canvas/inspector.css">
<link rel="stylesheet" href="/canvas/components.css">
<link rel="stylesheet" href="/canvas/history.css">
<link rel="stylesheet" href="/canvas/tokens.css">
<link rel="stylesheet" href="/canvas/agents.css">
<link rel="stylesheet" href="/canvas/polish.css">
<link rel="stylesheet" href="/canvas/doc.css">
<link rel="stylesheet" href="/canvas/time.css">
<link rel="stylesheet" href="/canvas/stage.css">
<link rel="stylesheet" href="/canvas/inspector-doc.css">
<link rel="preload" href="/dials/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/dials/dials.css">
<link rel="stylesheet" href="/canvas/surface.css">
<body>
  <a class="skip" href="#stage">Skip to the canvas</a>
  <header id="topbar">
    <div class="bar-left">
      <h1 class="brand"><svg class="glyph" viewBox="0 0 20 20" width="15" height="15" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor"><path d="M0 0h20v4H0zM0 4h16v4H0zM0 8h12v4H0zM0 12h8v4H0zM0 16h4v4H0z"/></svg><span class="sr-only">napkin: </span><span id="folder">components</span></h1>
      <button type="button" class="icon-btn" id="panel-toggle" aria-controls="sidebar" aria-expanded="true" aria-keyshortcuts="Control+Backslash" aria-label="Layers panel" data-tip="Hide layers" data-key="Ctrl+\"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2.25" y="2.75" width="11.5" height="10.5" rx="1.5"/><path d="M6.25 2.75v10.5"/></svg></button>
    </div>
    <div id="toolbar"></div>
    <div class="top-right">
      <span class="meta" hidden title="The selected file’s revision">rev <code id="revision">…</code></span>
      <span class="slot"><span id="agent-status" hidden>agent connected</span><span id="presence" role="status" aria-live="polite"></span></span>
      <button type="button" id="quick-open" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3 3"/></svg><span>Jump to…</span><kbd data-keys="Mod+K">Ctrl K</kbd></button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch chrome theme" data-tip="Light or dark chrome"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5.25"/><path d="M8 2.75a5.25 5.25 0 0 0 0 10.5z" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </header>
  <nav id="sidebar" aria-labelledby="side-title">
    <div class="side-head">
      <h2 id="side-title">Layers</h2>
      <button type="button" class="icon-btn" id="side-back" hidden aria-label="Back to layers" data-tip="Back to layers" data-key="Esc"><svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.75 3.75l8.5 8.5M12.25 3.75l-8.5 8.5"/></svg></button>
    </div>
    <div id="layers" role="tree" aria-label="Layers"></div>
  </nav>
  <main id="stage" aria-label="Canvas" tabindex="-1">
    <p id="scan-progress" role="status"></p>
    <div id="world"></div>
    <div id="overlays" aria-hidden="true"></div>
    <div id="marquee" hidden></div>
    <p id="hint" role="status"></p>
    <p id="error" role="status"></p>
  </main>
  <aside id="inspector" aria-label="Design panel">
    <div id="panel"></div>
  </aside>
  <section id="dock" aria-label="Code and proposals" hidden>
    <div id="code-strip"></div>
    <div id="proposals-tray"></div>
  </section>
  <footer id="statusbar">
    <span id="counts" aria-live="off"></span>
    <span id="drawer-tabs" role="group" aria-label="Panels"></span>
    <span class="hints"><span class="h"><kbd data-keys="Shift+1">Shift 1</kbd> fit all</span> <span class="h"><kbd data-keys="Shift+2">Shift 2</kbd> fit selection</span> <span class="h"><kbd>Enter</kbd> focus</span></span>
    <span class="zoomctl" role="group" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button type="button" id="zoom-level" aria-label="Zoom level, click for 100%" title="Zoom to 100% ({k})" data-title-keys="Shift+0">100%</button>
      <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button type="button" id="zoom-fit" aria-label="Fit all" title="Fit all ({k})" data-title-keys="Shift+1">Fit</button>
    </span>
  </footer>
  <script src="/canvas/early.js"></script>
  <script type="module" src="/canvas/main.js"></script>
</body>
</html>
