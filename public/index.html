<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>napkin canvas</title>
<style>
  :root { --ink: #1f2a44; --paper: #f4efe4; --grid: #e4dccb; --accent: #c8553d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--paper); display: grid; grid-template-columns: 1fr 280px; min-height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 16px; align-items: baseline; padding: 12px 20px; border-bottom: 2px solid var(--ink); background: #fffdf7; }
  header strong { font-family: Georgia, serif; font-size: 18px; }
  #stage { display: grid; place-items: center; padding: 40px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
  aside { border-left: 2px solid var(--ink); padding: 20px; background: #fffdf7; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { margin: 0; font: 600 12px/1 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; }
  label { display: grid; gap: 4px; font-weight: 600; }
  input { font: 14px ui-monospace, monospace; padding: 6px 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); }
  input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  #log { margin: 0; padding: 0; list-style: none; font: 12px/1.5 ui-monospace, monospace; max-height: 260px; overflow: auto; }
  #log li { border-top: 1px dashed var(--grid); padding: 2px 0; }
  .by-agent { color: #2d6a4f; } .by-canvas { color: var(--accent); } .by-file { color: #5a4fcf; }
  #error { color: var(--accent); min-height: 1.4em; margin: 0; }
  .flash { animation: flash .6s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 6px #c8553d55; } to { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
<body>
  <header><strong>napkin</strong><span>Card · <code>components/Card.json</code></span><span>revision <code id="revision">…</code></span></header>
  <main id="stage" aria-label="Canvas"></main>
  <aside aria-label="Properties">
    <h2>Card</h2>
    <label>Padding <input id="padding" autocomplete="off"></label>
    <h2>Title</h2>
    <label>Weight <input id="fontWeight" autocomplete="off" inputmode="numeric"></label>
    <p id="error" role="status"></p>
    <h2>Changes</h2>
    <ul id="log" aria-live="polite"></ul>
  </aside>
  <script type="module" src="/canvas.js"></script>
</body>
</html>
