<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dials</title>
    <link rel="stylesheet" href="./dials.css" />
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <a class="skip" href="#studies">Skip to instruments</a>
    <header class="mast">
      <a class="wordmark" href="./demo.html"
        ><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true">
          <path
            d="M3 3H17V11L11 17H3ZM11 17V11H17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          /></svg
        >napkin <span>/ dials</span></a
      >
            <button id="theme" type="button">Dark</button>
    </header>
    <main>
      <div class="workspace-bar">
        <h1>Instruments</h1>
        <div class="depth-all" role="group" aria-label="Set all section depths">
          <button type="button" data-depth="1">All dials</button
          ><button type="button" data-depth="2">All benches</button>
        </div>
        <button id="help" type="button">Keyboard map <kbd>?</kbd></button>
      </div>
      <div id="studies" class="studies"></div>
      <details class="catalog">
        <summary>
          Catalogue
          <span>More controls, a plugin, schema source</span>
        </summary>
        <div class="catalog-body">
          <div id="gallery"></div>
          <div>
            <h2>Schema</h2>
            <p>Each panel is rendered from the JSON document shown here.</p>
            <label for="schema-select">Inspect a schema</label
            ><select id="schema-select"></select>
            <pre
              id="schema-source"
              tabindex="0"
              aria-label="Schema source JSON"
            ></pre>
            <button id="performance" type="button">Measure 200 controls</button
            ><output id="performance-result"></output>
          </div>
        </div>
      </details>
    </main>
    <footer>
      <output id="event" aria-live="polite">Ready.</output>
    </footer>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
